name = "AIO - Arma Inventory Overhaul"
prefix = "aio"
author = "Miss Heda"
mainprefix = "z"

[files]
include = [
    "mod.cpp",
    "README.md",
    "CHANGELOG.md",
]

[version]
git_hash = 0

[hemtt.config]
preset = "Hemtt"

# Mods loaded alongside for testing. hemtt launch already sets -skipIntro -noSplash
# -showScriptErrors -debug and file patching by itself.
#
# Anything specific to your machine - an Arma profile, a custom mod folder - goes on the
# command line rather than in here, so the repo stays the same for everyone:
#
#   hemtt launch -- -name="Your Profile"
[hemtt.launch.default]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "1779063631", # Zeus Enhanced
    "3499977893", # Advanced Developer Tools
    "3316254084", # ACM - Advanced Combat Medical (Experimental), as Enhanced First Aid Kits tests with
    # "3235483358", # ACM - Advanced Combat Medical (stable)
    # "3749759934", # ACM Extended
    # "2129532219", # SFX Project: Remastered, adds an InventoryOpened handler of its own (the window must still open)
    "3809430149", # Enhanced First Aid Kits
    "894678801",  # Task Force Arrowhead Radio (BETA), for the radio compat
    "843577117", #RHS
    "1376867375", # ACE Interaction Menu Expansion (AIME), for the compat_aime addon
    "3401580668", # Mavic 3 - Improved, for the compat_mavic addon
    "3475006113", # Ukraine FPV Drone, for the compat_fpv addon
    "2976569274", # WebKnight's Two Primary Weapons, for the compat_wbk_twoprimary addon
    # "2893363164", # KJW's Two Primary Weapons, for the compat_kjw_twoprimary addon (instead of WebKnight's, not with it)
]

# With GreenMag Rework, for the compat_greenmag addon - built locally, not on the Workshop: its last `hemtt dev` (run there
# after a change), loaded by a second -mod parameter. The dev output, not `hemtt build`: with file patching Arma also reads
# GreenMag's loose files through the link `hemtt dev` makes (Arma 3\z\gmr), and a build of another state did not match them
# ("fnc_clipsOf.sqf not found"). The path is the GreenMag-Rework checkout next to this one on the author's machine.
#
#   hemtt launch greenmag
[hemtt.launch.greenmag]
extends = "default"
workshop = [
    "2372036642", # BackpackOnChest - Redux, for the compat_boc addon (the original, 820924072, downloads empty here)
]
parameters = [
    "-mod=\"C:\\Users\\Heda\\GitHub Repos\\GreenMag-Rework\\.hemttout\\dev\"", # quoted as HEMTT quotes its own -mod
]

# Ravage, for the compat_ravage addon: play a Ravage mission (or put Ravage's modules in Eden) and "Search"
# a fridge, a cupboard or a crate.
#
#   hemtt launch ravage
[hemtt.launch.ravage]
extends = "default"
workshop = [
    "1376636636", # Ravage
]

# A test scene for the inventory (.hemtt/missions/AIO_Test.VR): a soldier with full gear, a crate, an
# ACE Arsenal box, a vehicle, a body and things on the ground. Opens in Eden - play it from there.
#
#   hemtt launch test
[hemtt.launch.test]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "1779063631", # Zeus Enhanced
    "3499977893", # Advanced Developer Tools
    "3316254084", # ACM - Advanced Combat Medical (Experimental)
    "3809430149", # Enhanced First Aid Kits
    "894678801",  # Task Force Arrowhead Radio (BETA)
    # "2129532219", # SFX Project: Remastered, adds an InventoryOpened handler of its own (the window must still open)
]
mission = "AIO_Test.VR"

# The same scene with ACRE2 instead of TFAR - the two never load together.
#
#   hemtt launch acre
[hemtt.launch.acre]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "1779063631", # Zeus Enhanced
    "3499977893", # Advanced Developer Tools
    "3316254084", # ACM - Advanced Combat Medical (Experimental)
    "3809430149", # Enhanced First Aid Kits
    "751965892",  # ACRE2, for the radio compat
    # "2129532219", # SFX Project: Remastered, adds an InventoryOpened handler of its own (the window must still open)
]
mission = "AIO_Test.VR"

# The same scene with CBA alone - AIO without ACE (issue #43): no ACE Arsenal grid, no repacking, no treating from the
# hotbar; everything else has to work. The test mission gives the vanilla kit then.
#
#   hemtt launch noace
[hemtt.launch.noace]
workshop = [
    "450814997",  # CBA_A3
    "3499977893", # Advanced Developer Tools
]
mission = "AIO_Test.VR"
